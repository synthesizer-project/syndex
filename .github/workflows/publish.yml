# Publish the package to PyPI when a version tag is pushed.
#
# The version is never written down: hatch-vcs reads it from the tag, so a
# release is a tag and nothing else, and the published metadata cannot
# disagree with what the repository says it is.
#
# Trusted publishing rather than an API token. The job proves it is this
# workflow in this repository through OIDC, so there is no long-lived
# credential to store, rotate, or leak.
name: Publish Python 🐍 distribution 📦 to PyPI

on:
  push:
    tags:
      - "v*.*.*" # Matches version tags like v1.0.0, v2.1.3, etc.

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          # hatch-vcs derives the version from the tag, so the full history
          # must be present; a shallow clone yields a dev version.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      # The tag says this is releasable; the tests say whether it is. A
      # broken release cannot be unpublished from PyPI, only yanked.
      - name: Install the package and its tests
        run: |
          python -m pip install --upgrade pip
          pip install ".[test]"

      - name: Run the tests
        run: pytest -q

      - name: Install build dependencies
        run: pip install build

      - name: Build source distribution and wheel
        run: python -m build

      - name: Store the distribution packages
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  publish-to-pypi:
    name: >-
      Publish Python 🐍 distribution 📦 to PyPI
    needs:
      - build
    runs-on: ubuntu-latest
    environment:
      name: pypi-deployment
      url: https://pypi.org/p/synthesizer-syndex
    permissions:
      id-token: write

    steps:
      - name: Download all the dists
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish distribution 📦 to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
