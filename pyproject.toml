[build-system]
requires = ["hatchling>=1.27", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[project]
name = "cosmos-syndex"
# From the git tag, so a release needs no source edit and the tag can never
# disagree with the published metadata.
dynamic = ["version"]
description = "Catalogue and publication tooling for Synthesizer data"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.10"
# Reading a file is all `syndex-check` does, and a contributor should not have
# to install an S3 client and a plotting stack to check one before submitting.
# Publishing and plotting pull their own dependencies through extras.
dependencies = [
    "h5py>=3.10",
    "numpy>=1.24",
]

[project.optional-dependencies]
publish = ["boto3>=1.34"]
plots = ["matplotlib>=3.8"]
# Everything, so the tests cover the publishing and plotting paths too. Named
# through the other extras rather than repeated, which is what stops a
# dependency added to one of them going missing from CI.
test = ["cosmos-syndex[publish,plots]", "pytest>=8"]

[project.scripts]
syndex-check = "syndex.check:main"
syndex-submit = "syndex.submit:main"
syndex-upload = "syndex.publish.cli:main"
syndex-plots = "syndex.plots.cli:main"
syndex-previews = "syndex.previews.cli:main"

[tool.hatch.version]
source = "vcs"

# Written at build time, not tracked. Mirrors Synthesizer's setuptools_scm
# version_file so the installed package can report what it is.
[tool.hatch.build.hooks.vcs]
version-file = "src/syndex/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/syndex"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
