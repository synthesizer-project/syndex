[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "synthesizer-syndicate"
version = "0.1.0"
description = "Catalogue and publication tooling for Synthesizer data"
requires-python = ">=3.10"
dependencies = [
    "boto3>=1.34",
    "h5py>=3.10",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
syndicate-upload = "syndicate.upload:main"
syndicate-plots = "syndicate.plots:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
