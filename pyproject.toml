[build-system]
requires = ["hatchling>=1.27", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[project]
name = "cosmos-syndex"
# From the git tag, so a release needs no source edit and the tag can never
# disagree with the published metadata.
dynamic = ["version"]
description = "Catalogue and publication tooling for Synthesizer data"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.10"
# Read by PyPI for its sidebar and by shields.io for the Python badge, which
# reads these rather than `requires-python` and said "missing" without them.
# No License classifier: `license` above is already an SPDX expression, and
# PyPI rejects a release that states it twice.
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Astronomy",
]
# Reading a file is all `syndex-check` does, and a contributor should not have
# to install an S3 client and a plotting stack to check one before submitting.
# Publishing and plotting pull their own dependencies through extras.
dependencies = [
    "h5py>=3.10",
    "numpy>=1.24",
]

[project.optional-dependencies]
publish = ["boto3>=1.34"]
plots = ["matplotlib>=3.8"]
# Everything, so the tests cover the publishing and plotting paths too. Named
# through the other extras rather than repeated, which is what stops a
# dependency added to one of them going missing from CI.
test = ["cosmos-syndex[publish,plots]", "pytest>=8"]
# The user documentation, served by the Worker at /syndex/docs. Sphinx pinned
# to Synthesizer's version so the two sites render alike.
docs = ["sphinx==7.4.7", "furo", "sphinx-copybutton", "sphinx-argparse"]

[project.scripts]
syndex-check = "syndex.check:main"
syndex-submit = "syndex.submit:main"
syndex-upload = "syndex.publish.cli:main"
syndex-plots = "syndex.plots.cli:main"
syndex-previews = "syndex.previews.cli:main"

# Without these the PyPI page links nowhere: no repository, no catalogue, no
# way back. Metadata belongs to a release and cannot be edited afterwards, so
# these appear on the next one.
[project.urls]
Homepage = "https://synthesizer-project.org/syndex"
Documentation = "https://synthesizer-project.org/syndex/docs/"
Repository = "https://github.com/synthesizer-project/syndex"
Issues = "https://github.com/synthesizer-project/syndex/issues"
Changelog = "https://github.com/synthesizer-project/syndex/releases"

[tool.hatch.version]
source = "vcs"

# Written at build time, not tracked. Mirrors Synthesizer's setuptools_scm
# version_file so the installed package can report what it is.
[tool.hatch.build.hooks.vcs]
version-file = "src/syndex/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/syndex"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

# Said outright rather than inferred. Which packages count as first-party
# decides where isort puts a blank line, and left to inference the answer
# depends on the ruff version: CI downloads the latest, a developer has
# whatever uvx cached, and the two disagreed.
[tool.ruff]
src = ["src", "tests"]

[tool.ruff.lint.isort]
known-first-party = ["syndex"]
